<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>WAWY responsive review</title>
<style>body{margin:0;background:#dcdedc;font:15px system-ui;color:#182e3b}header{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid #aaa}select,button{font:inherit;padding:8px}main{padding:20px;overflow:auto}iframe{display:block;background:#fff;border:0;box-shadow:0 3px 20px #0002;height:1100px;margin:auto}p{margin:0}output{padding:8px 20px;display:block;font-size:13px}</style></head>
<body><header><strong>Design review only</strong><label>Page <select id="page"><option value="../index.html">Homepage</option><option value="../media.html">Media</option><option value="../student-community.html">GYCO</option><option value="../community/index.html">Portal entry</option><option value="../community/login.html">Login</option><option value="../contact.html">Contact</option><option value="../fundraising/index.html">Support Us</option><option value="../our-philosophy.html">Philosophy</option><option value="../partner.html?p=cancer-care">Partner</option><option value="https://www.we-are-with-you.org/">Before: live homepage</option></select></label><label>Width <select id="width"><option value="390">Mobile 390</option><option value="320">Small mobile 320</option><option value="768">Tablet 768</option><option value="1024">Desktop 1024</option><option value="1440">Desktop 1440</option></select></label><button id="reload">Reload page</button><p>Preview inspection. Live account actions are not test data.</p></header><output id="status" aria-live="polite"></output><main><iframe id="frame" title="Responsive website preview" width="390" src="../index.html"></iframe></main>
<script>
const frame=document.getElementById('frame'),width=document.getElementById('width'),page=document.getElementById('page'),status=document.getElementById('status');
function inspect(){try{const d=frame.contentDocument;status.textContent='Viewport: '+width.value+'px. Document width: '+d.documentElement.scrollWidth+'px. '+(d.documentElement.scrollWidth>Number(width.value)?'Horizontal overflow detected.':'No horizontal overflow.');}catch{status.textContent='External live page: visual comparison only.';}}
width.addEventListener('change',()=>{frame.width=width.value;setTimeout(inspect,200)});
page.addEventListener('change',()=>{frame.src=page.value});document.getElementById('reload').addEventListener('click',()=>{frame.src=page.value});frame.addEventListener('load',()=>{inspect();setTimeout(inspect,1500)});
</script></body></html>
